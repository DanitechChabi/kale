# Base de données PostgreSQL pour le développement local d'EduRelevé.
# Lancement : docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: edureleve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edureleve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edureleve}
      POSTGRES_DB: ${POSTGRES_DB:-edureleve}
      # Fuseau horaire du Bénin (UTC+1)
      TZ: Africa/Porto-Novo
    # 5433 côté machine : un PostgreSQL déjà installé utilise souvent 5432
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - edureleve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edureleve} -d ${POSTGRES_DB:-edureleve}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edureleve_pgdata:

# ============================================================
# Kalé — Blueprint Render (plan gratuit)
# Déploie le backend santé temporaire (services/health-api).
# Découvert automatiquement par Render à la racine du dépôt.
# Usage : connecter le repo à Render → "New Blueprint" → Apply.
# ============================================================

services:
  - type: web
    name: kale-api
    runtime: node
    plan: free
    rootDir: services/health-api
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

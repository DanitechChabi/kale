# Garde EduRelevé éveillé : l'instance gratuite de Render s'endort après 15 minutes
# sans visite, et le réveil prend près d'une minute. Cette tâche appelle /health
# toutes les 10 minutes (horaire indicatif : GitHub peut décaler l'exécution).
#
# Les tâches planifiées ne s'exécutent que depuis la branche par défaut du dépôt.
# Adresse modifiable sans toucher au fichier : variable de dépôt EDURELEVE_URL.
name: Garder EduRelevé éveillé

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Appel de /health (3 tentatives, délai long pour le réveil)
        env:
          URL: ${{ vars.EDURELEVE_URL || 'https://edureleve.onrender.com' }}
        run: |
          for tentative in 1 2 3; do
            if reponse=$(curl -fsS --max-time 120 "$URL/health"); then
              echo "Tentative $tentative : $reponse"
              exit 0
            fi
            echo "Tentative $tentative échouée, nouvel essai dans 30 s"
            sleep 30
          done
          echo "::error::$URL/health ne répond pas après 3 tentatives"
          exit 1

openapi: 3.1.0
info:
  title: Kalé API
  version: 0.1.0
  description: >
    API du réseau social communautaire Kalé. Source unique de vérité — les clients
    Dart (Flutter) et TypeScript (PWA) sont générés depuis ce fichier.
    Contraintes : payloads data-frugaux (~1-3 Ko/message), offline-first (delta sync).

servers:
  - url: http://localhost:4000
    description: Développement local
  - url: https://api.kale.example.com
    description: Production (à définir)

tags:
  - name: health
    description: État du service
  - name: auth
    description: Authentification par téléphone + OTP

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: État du backend
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service en dégradation (ex. DB injoignable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/request_otp:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Demander un code OTP par SMS
      description: >
        Envoie un code OTP à 6 chiffres sur le téléphone. En dev (provider `fake`),
        le code est toujours `000000`. Idempotent : renvoie toujours 200 si le numéro
        est syntaxiquement valide (évite l'énumération de numéros).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpRequest"
      responses:
        "200":
          description: OTP envoyé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOtpResponse"
        "422":
          description: Numéro invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify_otp:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Vérifier le code OTP et obtenir une session
      description: >
        Vérifie le code, crée (ou connecte) l'utilisateur et renvoie une paire de
        jetons (access + refresh). L'access token est envoyé en `Authorization: Bearer`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Session créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOtpResponse"
        "401":
          description: Code invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rafraîchir la session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOtpResponse"
        "401":
          description: Refresh token invalide ou révoqué
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Version du backend
        db:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code machine, ex. `otp_invalid`
        message:
          type: string
          description: Message lisible (français par défaut)

    RequestOtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Numéro E.164, ex. +22997123456
          example: "+22997123456"

    RequestOtpResponse:
      type: object
      required: [phone, expires_in]
      properties:
        phone:
          type: string
        expires_in:
          type: integer
          description: Durée de validité du code, en secondes
          example: 300

    VerifyOtpRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "+22997123456"
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "000000"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    VerifyOtpResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
          description: JWT court (15 min)
        refresh_token:
          type: string
          description: Jeton de rafraîchissement (30 jours)
        user:
          $ref: "#/components/schemas/UserPublic"

    UserPublic:
      type: object
      required: [id, phone, username]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        username:
          type: string
        full_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        language:
          type: string
          default: fr
